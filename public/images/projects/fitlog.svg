<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fitBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="fitShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fitBgGrad)" rx="16" />

  <!-- App Window Container -->
  <g transform="translate(40, 30)" filter="url(#fitShadow)">
    <rect width="720" height="440" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="720" height="44" rx="12" fill="#1f2937" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" />
    <circle cx="59" cy="22" r="5" fill="#10b981" />

    <!-- App Brand -->
    <text x="90" y="27" fill="#f3f4f6" font-family="system-ui, sans-serif" font-weight="700" font-size="14">FitLog ⚡</text>
    <text x="160" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Fitness &amp; Workout Tracker</text>

    <!-- Profile badge -->
    <circle cx="680" cy="22" r="12" fill="#8b5cf6" />
    <text x="674" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MM</text>

    <!-- Top Stats Row -->
    <!-- Card 1: Calories -->
    <rect x="25" y="65" width="210" height="110" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="40" y="92" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Calories Burned</text>
    <text x="40" y="125" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="700" font-size="26">2,140 <tspan font-size="14" fill="#9ca3af" font-weight="400">kcal</tspan></text>
    <rect x="40" y="142" width="180" height="8" rx="4" fill="#374151"/>
    <rect x="40" y="142" width="145" height="8" rx="4" fill="#f43f5e"/>
    <text x="40" y="162" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Goal: 2,400 kcal (89%)</text>

    <!-- Card 2: Workout Time -->
    <rect x="255" y="65" width="210" height="110" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="270" y="92" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Active Workout</text>
    <text x="270" y="125" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="700" font-size="26">58 <tspan font-size="14" fill="#9ca3af" font-weight="400">mins</tspan></text>
    <rect x="270" y="142" width="180" height="8" rx="4" fill="#374151"/>
    <rect x="270" y="142" width="160" height="8" rx="4" fill="#a855f7"/>
    <text x="270" y="162" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Target: 45 mins (+28%)</text>

    <!-- Card 3: Water Intake -->
    <rect x="485" y="65" width="210" height="110" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="500" y="92" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Water Hydration</text>
    <text x="500" y="125" fill="#06b6d4" font-family="system-ui, sans-serif" font-weight="700" font-size="26">2.8 <tspan font-size="14" fill="#9ca3af" font-weight="400">Liters</tspan></text>
    <rect x="500" y="142" width="180" height="8" rx="4" fill="#374151"/>
    <rect x="500" y="142" width="135" height="8" rx="4" fill="#06b6d4"/>
    <text x="500" y="162" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Daily Goal: 3.0 Liters</text>

    <!-- Workout Logs List & Progress -->
    <g transform="translate(25, 195)">
      <!-- Left side: Recent Workouts -->
      <rect width="360" height="225" rx="10" fill="#1f2937" stroke="#374151"/>
      <text x="20" y="30" fill="#f3f4f6" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Recent Sessions</text>

      <rect x="20" y="50" width="320" height="45" rx="8" fill="#111827"/>
      <text x="35" y="72" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Upper Body Hypertrophy</text>
      <text x="35" y="86" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">5 exercises • 42 mins</text>
      <text x="285" y="77" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+340 kcal</text>

      <rect x="20" y="105" width="320" height="45" rx="8" fill="#111827"/>
      <text x="35" y="127" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Core &amp; HIIT Sprint</text>
      <text x="35" y="141" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">8 rounds • 25 mins</text>
      <text x="285" y="132" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+280 kcal</text>

      <rect x="20" y="160" width="320" height="45" rx="8" fill="#111827"/>
      <text x="35" y="182" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Evening Mobility &amp; Stretch</text>
      <text x="35" y="196" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Full body • 18 mins</text>
      <text x="285" y="187" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+95 kcal</text>

      <!-- Right side: Weekly Activity Bars -->
      <g transform="translate(380, 0)">
        <rect width="290" height="225" rx="10" fill="#1f2937" stroke="#374151"/>
        <text x="20" y="30" fill="#f3f4f6" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Weekly Consistency</text>

        <!-- 7 Days Bar Chart -->
        <!-- Mon -->
        <rect x="30" y="90" width="22" height="90" rx="4" fill="#a855f7" />
        <text x="33" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Mon</text>

        <!-- Tue -->
        <rect x="65" y="70" width="22" height="110" rx="4" fill="#a855f7" />
        <text x="68" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Tue</text>

        <!-- Wed -->
        <rect x="100" y="115" width="22" height="65" rx="4" fill="#6b7280" />
        <text x="103" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Wed</text>

        <!-- Thu -->
        <rect x="135" y="60" width="22" height="120" rx="4" fill="#a855f7" />
        <text x="138" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Thu</text>

        <!-- Fri -->
        <rect x="170" y="80" width="22" height="100" rx="4" fill="#a855f7" />
        <text x="173" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Fri</text>

        <!-- Sat -->
        <rect x="205" y="50" width="22" height="130" rx="4" fill="#ec4899" />
        <text x="208" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Sat</text>

        <!-- Sun -->
        <rect x="240" y="100" width="22" height="80" rx="4" fill="#3b82f6" />
        <text x="243" y="195" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Sun</text>
      </g>
    </g>
  </g>
</svg>